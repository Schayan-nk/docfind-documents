        name: x.name, count: x.count,
        on: filter.group === x.name && !filter.ref && !filter.category,
        into: (x.references || []).length > 0,
        data: ` data-g="${esc(x.name)}" data-path="${esc(x.name)}"`,
      });
    }
  } else if (!r) {
    // Inside a group: its references.
    const refs = g.references || [];
    html += heading(refs.length) + '<div role="tree" aria-label="پوشه‌ها">';
    for (const x of refs) {
      html += node({
        name: x.name, count: x.count,
        on: filter.ref === x.ref && !filter.category,
        into: (x.categories || []).length > 0,
        data: ` data-g="${esc(g.name)}" data-r="${esc(x.ref)}" data-rk="${esc(g.name + '/' + x.name)}" data-path="${esc(g.name + '/' + x.name)}"`,
      });
    }
  } else {
    // The deepest level: the document categories inside a reference.
    const cats = r.categories || [];
    html += heading(cats.length) + '<div role="tree" aria-label="پوشه‌ها">';
    for (const x of cats) {
      // These do carry a count, where the desktop's deliberately do not.
      // There the document list is the next pane, already on screen; here it
      // is the next screen, so the number of documents is worth knowing
      // before spending a tap to go and look.
      html += node({
        name: x.name, count: x.count,
        on: filter.ref === r.ref && filter.category === x.name,
        data: ` data-g="${esc(g.name)}" data-r="${esc(r.ref)}" data-c="${esc(x.name)}" data-path="${esc(g.name + '/' + r.name + '/' + x.name)}"`,
      });
    }
  }

  $('side').classList.add('drill');
  $('side').innerHTML = html + '</div>';

  // Opened only now, with rows in it -- opening an empty panel and filling it
  // a moment later reads as a glitch.
  showFoldersFirst();

  wireTreeKeys();
  wireDocsRows();

  // Up one level, not back to the top: someone comparing two references
  // inside the same group would otherwise start again from the root every
  // time. Only the drawer is rebuilt, so the results keep whatever they
  // were filtered to on the way down -- which is also why the folder tapped
  // to get here is still the selected row when you arrive back at it.
  const upBtn = $('side').querySelector('.drill-up');
  if (upBtn) upBtn.onclick = () => { drill = drill.slice(0, -1); tree(); };

  $('side').querySelector('.drill-close').onclick =
    () => document.body.classList.remove('nav-open');

  for (const el of $('side').querySelectorAll('[data-all],[data-g]')) {
    el.onclick = () => {
      filter = filterOf(el);
      // A folder with folders inside it goes down a level and the panel
      // stays open showing them. Anything else is as deep as this branch
      // goes, so the documents are what comes next, and the panel closing
      // is handled where the rest of the phone navigation lives.
      if (el.dataset.into) drill = el.dataset.rk ? [el.dataset.g, el.dataset.rk] : [el.dataset.g];
      tree(); search();
    };
  }
}

// ---------- results ----------

function highlight(text, query) {
  const terms = String(query || '').replace(/["\u00ab\u00bb]/g, ' ').split(/\s+/).filter(t => t.length > 1);
  let out = esc(text);
  for (const t of terms) {
    const safe = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try { out = out.replace(new RegExp('(' + safe + ')', 'gi'), '<mark>$1</mark>'); } catch {}
  }
  return out;
}

const emptyIcon = `<svg class="ic" aria-hidden="true"><use href="#i-file-text"/></svg>`;

function placeholder(el, title, detail) {
  el.innerHTML = `<div class="empty rise" style="height:100%">
    <div>${emptyIcon}<b>${esc(title)}</b>${esc(detail)}</div>
  </div>`;
}

// Skeleton rows while a search runs, so the pane shows the shape of what is
// coming rather than going blank.
function listSkeleton() {
  // The skeleton says "rows are coming and roughly this shape"; the line above
  // it says which of the several things this page does is happening. Grey bars
  // alone read the same whether the search is running or the page has stalled.
  $('list').innerHTML =
    '<div class="searching" role="status">' +
      '<span class="bead" aria-hidden="true"></span>' +
      '<span class="word">در حال جستجو</span>' +
    '</div>' +
    '<div class="skel">' +
    Array.from({ length: 6 }, (_, i) =>
      `<i style="width:${92 - (i % 3) * 13}%;height:${i % 2 ? 13 : 34}px"></i>`).join('') +
    '</div>';
}

placeholder($('view'), 'Select a document', 'Choose one from the list, or search above.');

// Reading the box as a question, and showing what was understood.
//
// askMode is off by default and the server only interprets when asked, so the
// ordinary search is untouched: the same words give the same results whether
// or not this feature exists.
let askMode = false;

// interpHTML renders the reading above the results.
//
// Every line here comes from the server, which produced it FROM the filters it
// applied -- not from a description of them. That is what makes the panel
// worth showing: it cannot claim a filter that did not run. See
// internal/find/nlquery.go.
function interpHTML(inp) {
  if (!inp) return '';
  const chips = (inp.understood || []).map(u =>
    `<span class="chip chip-plain" title="${esc(u.from)}">${esc(u.means)}</span>`).join('');
  const dropped = (inp.unused || []).length
    // Named rather than silently swallowed. A reader whose key word was taken
    // for grammar needs to see that it was, or the results are inexplicable.
    ? `<div class="meta" style="margin-top:6px">واژه‌های نادیده‌گرفته‌شده: ${
        inp.unused.map(w => esc(w)).join('، ')}</div>`
    : '';
  return `<section class="notice rise" dir="rtl" style="margin-bottom:8px">
      <div style="font-size:var(--text-sm)">${esc(inp.summary || '')}</div>
      ${chips ? `<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:7px">${chips}</div>` : ''}
      ${dropped}
    </section>`;
}

async function search() {
  const q = $('q').value.trim();
  $('clearQ').classList.toggle('on', !!q);
  $('qHint').style.display = q ? 'none' : '';

  listSkeleton();
  let r;
  try {
    const params = { q, category: filter.category, group: filter.group, ref: filter.ref };
    if (askMode) params.ask = '1';
    r = await jget(api('/api/search', params));
  } catch (e) {
    placeholder($('list'), 'Something went wrong', problem(e));
    return;
  }

  rows = r.results || [];
  const where = filter.category ? ` in ${filter.category}`
              : filter.ref ? ` in ${filter.ref}`
              : filter.group ? ` in ${filter.group}` : '';
  // r.total is how many documents matched; r.count is how many came back in
  // this response. Reporting r.count made the header read "200 documents" for
  // every broad search, because 200 is the server's result limit -- fine while
  // the whole archive was smaller than that, wrong the moment it was not.
  const total = r.total == null ? r.count : r.total;
  const shown = total > r.count ? `, showing first ${num(r.count)}` : '';
  $('count').textContent =
    `${num(total)} document${total === 1 ? '' : 's'}${where}${shown} · ${num(r.took_ms)} ms`;

  const interp = interpHTML(r.interpretation);

  if (!rows.length) {
    placeholder($('list'), 'Nothing found',
      q ? 'Try fewer words, or part of a reference number.' : 'This folder is empty.');
    // The reading goes ABOVE the "nothing found" notice, and this is the case
    // it matters most in. An empty result after a question is the moment a
    // reader most needs to see how their words were taken -- a month they did
    // not mean, or a key word dropped as grammar, explains the emptiness and
    // tells them what to change.
    if (interp) $('list').insertAdjacentHTML('afterbegin', interp);
    return;
  }

  // r.corrected lists any query word that matched nothing on its own and had
  // to be fuzzy-matched to a real word in the archive -- shown so a result set
  // built on a guess never looks like an exact match.
  const correctedHint = r.corrected
    ? `<div class="notice rise" style="margin-bottom:6px;font-size:var(--text-sm)">
        Showing results for ${Object.entries(r.corrected).map(([typed, fixed]) =>
          `<b>${esc(fixed)}</b> <span style="color:var(--fg-faint)">(typed "${esc(typed)}")</span>`).join(', ')}
      </div>`
    : '';

  $('list').innerHTML = interp + correctedHint + rows.map((d, i) => `
    <div class="row-item rise" data-i="${i}" tabindex="0" role="button"
         style="animation-delay:${Math.min(i, 12) * 18}ms">
      <div class="row" style="gap:var(--s2)">
        <span class="ref">${esc(d.ref || '—')}</span>
        <span class="chip chip-accent chip-plain">${esc(d.category)}</span>
      </div>
      <div class="meta">${esc(d.name)} · ${kb(d.size)} · ${esc(d.modified)}</div>
      ${d.snippet ? `<div class="snip" dir="auto">${highlight(d.snippet, q)}</div>` : ''}
    </div>`).join('');

  for (const el of $('list').querySelectorAll('[data-i]')) {
    const open = () => show(+el.dataset.i);
    el.onclick = open;
    // A row is operable by keyboard as well as mouse, which is why it carries
    // a tabindex and a role above.
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  }
}

// viewMode is remembered between documents: someone checking a run of
// invoices wants the same view each time, not a mode that resets.
let viewMode = 'document';

// Below the breakpoint the document is not previewed at all -- not hidden
// after the fact, not built and then covered: never fetched.
//
// Three reasons, and the first two cannot be styled away:
//
//   * A .docx carries fixed page geometry. Measured on a 360px viewport, the
//     rendered page is 794px wide inside a 360px pane (#docBody scrollWidth
//     806) and the header image inside it is 699px. That is two axes of
//     panning to read one inquiry, with no zoom-to-fit.
//   * Getting there costs the file plus the renderer every time a row is
//     tapped: 235 KB for /api/doc on the first document measured, 28 KB for
//     jszip and 21 KB for docx-preview -- 285 KB over the wire, on a
//     connection that is metered precisely because it is a phone.
//   * The desktop escape hatch does not exist here. "Open in Word" posts to
//     /api/open, which runs openInShell() on the *server* and is admin-only
//     anyway. On a phone it would open Word on a PC in the office.
//
// So the phone gets the file's identity and the one control that does work
// there: Download, as an <a download> rather than a location.href, because
// the server serves PDFs and images with Content-Disposition: inline and a
// bare navigation would replace the application with a viewer.
// A phone in either orientation.
//
// This was width alone, at 820px -- which an iPhone exceeds the moment it is
// turned sideways: an iPhone 14 in landscape is 844px wide and a 15 Pro Max
// is 956. So the preview came back on exactly the device the whole handoff
// exists for, and the reason it was unreadable in portrait -- a .docx carries
// fixed page geometry, 794px of it -- is no better in landscape, where there
// are only 390 pixels of height to read it in.
//
// The short axis is the orientation-independent fact. Every iPhone is at most
// 480px on its narrow side; no iPad is under 744. The pointer test keeps a
// narrow desktop window out of it -- that has hover, "Open in Word", and a
// user who can widen it.
const phoneView = window.matchMedia(
  '(max-width: 820px), (pointer: coarse) and (max-height: 480px)');

// The Word editor (office.go), for the formats it saves as themselves; shown
// once /api/me has said the server has one.
function wordButton(d) {
  if (!/\.(docx|xlsx|pptx)$/i.test(d.name)) return '';
  return `<a class="btn btn-sm word-btn" href="/office?id=${encodeURIComponent(d.id)}"${window.docfindOffice ? '' : ' hidden'}
       title="ویرایش در Word">Edit in Word</a>`;
}

function renderHandoff(d) {
  const href = api('/api/doc', { id: d.id, mode: 'download' });
  // On a phone the facts matter most: the page itself is not readable here.
  setTimeout(() => loadDocFacts(d.id));
  $('view').innerHTML = `
    <div class="doc-bar">
      <span class="doc-title">${esc(d.name)}</span>
      <a class="btn btn-primary btn-sm" href="${esc(href)}" download="${esc(d.name)}">
        <svg class="ic" aria-hidden="true"><use href="#i-download"/></svg>
        Download
      </a>
      ${wordButton(d)}
    </div>
    <div id="docFacts" class="doc-facts" hidden></div>
    <div id="docBody">
      <div class="doc-hand rise">
        <svg class="ic" aria-hidden="true"><use href="#i-file-text"/></svg>
        <b>${esc(d.name)}</b>
        <div class="hand-meta">${esc(d.ref || '\u2014')} \u00b7 ${esc(d.category)} \u00b7 ${kb(d.size)} \u00b7 ${esc(d.modified)}</div>
        <p class="hand-note">A Word document is laid out for a printed page, which a phone cannot show at a readable size. Download it to open it here, or read just the words.</p>
        <div class="hand-acts">
          <a class="btn btn-primary" href="${esc(href)}" download="${esc(d.name)}">Download the document</a>
          <button id="handText" type="button" class="btn">Read the text instead</button>
        </div>
      </div>
    </div>`;
  // The words alone are a JSON response rather than the binary, and they
  // reflow: measured 326/326 inside a 390px screen. Nothing is fetched until
  // this is tapped.
  $('handText').onclick = () => {
    $('docBody').innerHTML = '<div class="skel"><i style="height:340px"></i></div>';
    fillTextBody(d);
  };
}

// The folders are the first screen on a phone.
//
// Not the results, because an archive of two hundred documents opens as an
// undifferentiated list and the reader's first question is which reference
// they want. The drawer is full width and drills one level at a time, so it
// is a screen in its own right rather than a panel over the results -- which
// is also why the "Folders" button is gone: it pointed at where you already
// are.
//
// Once only. Someone who closes it to read a document and then searches
// should not have it reappear over their results on the next render.
let foldersShown = false;
function showFoldersFirst() {
  if (foldersShown || !phoneView.matches) return;
  foldersShown = true;
  document.body.classList.add('nav-open');
}

// A tablet rotated across the breakpoint would otherwise keep whichever of the
// two views it was on. Additive and fails closed if the event never arrives.
//
// The folder panel has the same two presentations for the same reason, and a
// window dragged narrow is the case that shows it: the panel is only rebuilt
// when something is browsed, so without this a desktop that became a phone
// would keep a tree it no longer has the width for until the next tap.
phoneView.addEventListener('change', () => { if (rows[sel]) renderDoc(); tree(); });

async function show(i) {
  if (i < 0 || i >= rows.length) return;
  sel = i;
  for (const el of $('list').querySelectorAll('[data-i]')) {
    const on = +el.dataset.i === i;
    el.classList.toggle('on', on);
    el.setAttribute('aria-current', on ? 'true' : 'false');
    if (on) el.scrollIntoView({ block: 'nearest' });
  }
  await renderDoc();
}

// What the document names, above it (docfacts.go): its amounts and payment
// terms, its reference numbers and its dates, each a piece of its own text.
// A reference searches the archive for the other documents that carry it.
// A document that names none of these gets no strip at all.
const factsFor = new Map();
async function loadDocFacts(id) {
  let f = factsFor.get(id);
  if (!f) {
    try {
      const r = await fetch(api('/api/doc/facts', { id }), { credentials: 'same-origin' });
      if (!r.ok) return;
      f = await r.json();
      factsFor.set(id, f);
    } catch (_) { return; }
  }
  const box = $('docFacts');
  if (!box || !rows[sel] || rows[sel].id !== id) return;
  const chips = (xs, attr) => xs.map(x => attr
    ? `<button type="button" class="chip chip-accent" ${attr}="${esc(x)}" dir="auto">${esc(x)}</button>`
    : `<span class="chip chip-plain" dir="auto">${esc(x)}</span>`).join('');
  const group = (label, html) => html ? `<div class="fact"><span class="fact-k">${label}</span>${html}</div>` : '';
  const html =
    group('Amounts', chips(f.amounts || [])) +
    group('Payment', chips(f.payments || [])) +
    group('References', chips(f.refs || [], 'data-find')) +
    group('Dates', chips(f.dates || []));
  box.innerHTML = html;
  box.hidden = !html;
}

// A reference in the strip: the other documents of the same order, invoice
// or tender, by searching for it. On a phone that is the results screen.
$('view').addEventListener('click', e => {
  const b = e.target.closest('[data-find]');
  if (!b) return;
  $('q').value = b.dataset.find;
  document.body.classList.remove('show-view');
  search();
});

async function renderDoc() {
  const d = rows[sel];
  if (!d) return;

  // Before anything is fetched, on purpose.
  if (phoneView.matches) { renderHandoff(d); return; }

  // The title and buttons never depend on how the body ends up rendering, so
  // they go up immediately -- the row already carries the name, no fetch
  // needed -- and the body fills in underneath once it's ready.
  $('view').innerHTML = `
    <div class="doc-bar">
      <span class="doc-title">${esc(d.name)}</span>
      <span id="docNote" class="dx-note" style="display:none"></span>
      <div class="seg" role="group" aria-label="View mode">
        <button id="mDoc" type="button" class="${viewMode === 'document' ? 'on' : ''}"
                aria-pressed="${viewMode === 'document'}">Document</button>
        <button id="mText" type="button" class="${viewMode === 'text' ? 'on' : ''}"
                aria-pressed="${viewMode === 'text'}">Text</button>
      </div>
      <button id="dlBtn" type="button" class="btn btn-primary btn-sm">
        <svg class="ic" aria-hidden="true"><use href="#i-download"/></svg>
        Download
      </button>
      ${wordButton(d)}
    </div>
    <div id="docFacts" class="doc-facts" hidden></div>
    <div id="docBody">
      <div class="skel"><i style="height:340px"></i></div>
    </div>`;
  loadDocFacts(d.id);

  $('mDoc').onclick = () => { if (viewMode !== 'document') { viewMode = 'document'; renderDoc(); } };
  $('mText').onclick = () => { if (viewMode !== 'text') { viewMode = 'text'; renderDoc(); } };

  // "Open in Word" was here and is gone, per request. It posted to /api/open,
  // which opens the file on the SERVER's desktop -- useful when the server was
  // the machine you were sitting at, and misleading the moment it is not.
  // Download is the honest way to open a copy in Word.
  $('dlBtn').onclick = () => { location.href = api('/api/doc', { id: d.id, mode: 'download' }); };

  if (viewMode === 'text') await fillTextBody(d);
  else await fillDocumentBody(d);
}

function docNote(msg) {
  const el = $('docNote');
  if (!el) return; // the view moved on (another document, or view mode) while this was loading
  el.style.display = msg ? 'inline' : 'none';
  el.textContent = msg;
}

async function fillTextBody(d) {
  const body = $('docBody');
  const q = $('q').value.trim();
  let full;
  try {
    full = await jget(api('/api/doc', { id: d.id, mode: 'text' }));
  } catch (e) {
    placeholder(body, 'Could not open it', problem(e));
    return;
  }
  fillTextBodyContent(body, full.text, q);
}

// fillDocumentBody renders the actual document, laid out the way Word lays it
// out: headers, footers, footnotes, real page geometry, page breaks in the
// right places. docx-preview does that by parsing the .docx directly in the
// browser -- the server-side renderer intentionally does not attempt page
// geometry at all (see internal/docxhtml), so it stays as the fallback for
// whatever docx-preview cannot open, and plain text stays the fallback after
// that. A document is never left blank just because the best available
// renderer for it had a bad day.

// The document renderer is fetched on demand.
//
// jszip and docx-preview are 173 KB together -- 49 KB gzipped -- and neither
// is touched until somebody opens a .docx. Loading them in the <head> put
// that download and parse on the critical path of a screen whose first job is
// to search, which most visits never leave.
let docxReady = null;
function loadDocxRenderer() {
  if (docxReady) return docxReady;
  const one = src => new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject({ kind: 'http', message: 'could not load ' + src });
    document.head.appendChild(el);
  });
  // Sequential, not parallel: docx-preview expects JSZip to already be there.
  docxReady = one('/vendor/jszip.min.js').then(() => one('/vendor/docx-preview.min.js'));
  // A failed load must not be cached as a permanent failure; the next attempt
  // should be allowed to try again.
  docxReady.catch(() => { docxReady = null; });
  return docxReady;
}

async function fillDocumentBody(d) {
  const body = $('docBody');
  const q = $('q').value.trim();

  try {
    // Fetching the file and fetching the renderer are independent, so they
    // overlap rather than queue.
    const [r] = await Promise.all([fetch(api('/api/doc', { id: d.id })), loadDocxRenderer()]);
    if (r.status === 401) throw signInAgain();
    if (r.status === 403) throw { kind: 'token' };
    if (!r.ok) throw { kind: 'http', message: r.status + ' ' + r.statusText };
    const blob = await r.blob();

    const host = document.createElement('div');
    host.className = 'dx-host';
    body.innerHTML = '';
    body.appendChild(host);

    await docx.renderAsync(blob, host, host, {
      inWrapper: true,
      ignoreLastRenderedPageBreak: true,
      useBase64URL: true, // no object URLs left behind when the next document replaces this one
      // An altChunk is an OOXML part that can embed arbitrary HTML; the
      // library's default renders it by setting an <iframe>'s srcdoc to that
      // HTML verbatim, unsandboxed, in the app's own origin -- a script inside
      // it could read this page's token from the URL and call the API with
      // it. Nothing this business generates uses altChunks, so the honest fix
      // is not rendering them at all rather than trying to sandbox a feature
      // nothing here needs.
      renderAltChunks: false,
    });
    if (rows[sel] !== d) return; // moved on while this was rendering
    setDocDirection(host);
    host.classList.add('rise'); // added post-render, so the fade coincides with content actually appearing
    if (q) markMatches(host, q);
    return;
  } catch (err) {
    if (rows[sel] !== d) return;
    logClientIssue('docx-preview could not render this document, falling back', err);
  }

  // Fall back to the server's own renderer.
  try {
    const full = await jget(api('/api/doc', { id: d.id, mode: 'html' }));
    if (rows[sel] !== d) return;
    if (full.html) {
      body.innerHTML = `<div class="sheet rise">${full.html}</div>`;
      // The server's renderer gets the same per-document decision as
      // docx-preview's output; it is the same archive either way.
      setDocDirection(body.firstElementChild);
      docNote(full.error ? `Shown with reduced fidelity: ${full.error}` : 'Shown with reduced fidelity.');
      if (q) markMatches(body, q);
      return;
    }
    // Neither renderer produced markup; fall through to text.
    fillTextBodyContent(body, full.text, q);
    docNote(full.error ? `Shown as text: ${full.error}` : 'Shown as text.');
  } catch (e) {
    placeholder(body, 'Could not open it', problem(e));
  }
}

function fillTextBodyContent(body, text, q) {
  body.innerHTML = `<div class="sheet rise"><div class="textfallback" dir="auto">${
    text ? highlight(text, q) : '<span class="dx-note">No text could be read from this file.</span>'
  }</div></div>`;
}

// logClientIssue keeps a quiet trail in the console for whoever's debugging a
// document that would not render, without interrupting the person reading it
// with a toast for something the fallback chain already handled.
function logClientIssue(context, err) {
  try { console.warn(context, err); } catch {}
}

// markMatches highlights search terms inside the rendered document by walking
// text nodes, so the document's own markup is never rewritten.
// setDocDirection decides which way ONE rendered document reads, from that
// document's own text.
//
// The archive is mixed and the mix is per FILE, not per folder: case 507-068
// holds inquiry_acme_english_507-068.docx beside its Persian twin. So there
// is no blanket answer. Pinning the pane left-to-right mangled the Persian
// quotations -- their label colons jumped to the far end of the line and the
// dotted leaders ran backwards -- and flipping the pin to right-to-left did
// exactly the same damage to the English ones. Same bug, opposite sign.
//
// Counting letters rather than trusting the file name, because the name is a
// convention and the content is the fact: "anfrage_acme_507-069.docx" is
// German, "507-071" says nothing at all, and a Persian document with an
// English name would be misread by any rule based on the name.
//
// A simple majority is the right test and not a lazy one. These are business
// documents, not bilingual prose: a Persian quotation carries Latin figures,
// part numbers, currency codes and an IBAN, and an English one carries almost
// no Persian. The two populations are nowhere near the boundary, so the
// decision is not delicate -- and a document with no letters at all (a scan,
// an empty page) correctly changes nothing.
function setDocDirection(host) {
  const text = host.textContent || '';
  let rtl = 0, ltr = 0;
  for (const ch of text) {
    if (joiner.test(ch)) rtl++;
    else if (ch >= 'A' && ch <= 'Z' || ch >= 'a' && ch <= 'z') ltr++;
  }
  if (rtl > ltr) {
    host.setAttribute('dir', 'rtl');
    // docx-preview builds its own wrapper inside the host, and that wrapper
    // is what the stylesheet targets, so the attribute goes on both.
    host.querySelectorAll('.docx-wrapper').forEach(w => w.setAttribute('dir', 'rtl'));
  }
}

function markMatches(root, query) {
  const terms = String(query).replace(/["«»]/g, ' ').split(/\s+/).filter(t => t.length > 1);
  if (!terms.length) return;

  const safe = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  let re;
  try { re = new RegExp('(' + safe + ')', 'gi'); } catch { return; }

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentNode && n.parentNode.nodeName !== 'MARK' && n.nodeValue.trim()
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
  });
  const targets = [];
  while (walker.nextNode()) targets.push(walker.currentNode);

  for (const node of targets) {
    if (!re.test(node.nodeValue)) { re.lastIndex = 0; continue; }
    re.lastIndex = 0;
    const text = node.nodeValue;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      // Grow the match out to whole-word boundaries before marking it. See
      // wordSpan: a <mark> that starts or ends INSIDE a Persian word breaks
      // the word in half on screen.
      const [from, to] = wordSpan(text, m.index, m.index + m[0].length);
      if (from > last) frag.appendChild(document.createTextNode(text.slice(last, from)));
      // A previous match may already have covered this one once both were
      // grown to the same word; skip it rather than emit an empty <mark>.
      if (to > Math.max(last, from)) {
        const mark = document.createElement('mark');
        mark.textContent = text.slice(Math.max(last, from), to);
        frag.appendChild(mark);
      }
      last = Math.max(last, to);
      if (m[0].length === 0) re.lastIndex++;
      else re.lastIndex = Math.max(re.lastIndex, last);
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

// joiner matches the characters that make up a word in a JOINING script --
// Arabic and Persian letters, their presentation forms, and the zero-width
// non-joiner Persian uses inside compounds like "می‌شود".
const joiner = /[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿‌‍]/;

// wordSpan widens [from,to) to cover the whole word when the match lands
// inside one written in a joining script.
//
// THIS IS THE "جمع ن هایی" BUG. Searching for a term that appears mid-word --
// and in Persian that is the normal case, because the definite, plural and
// possessive endings are suffixes -- put a <mark> boundary between two letters
// that are supposed to be joined. Arabic script is cursive: every letter has
// an initial, medial, final and isolated form, and the browser picks between
// them by looking at the neighbours WITHIN one text node. Split "نهایی" across
// an element boundary and the shaper can no longer see that the "ن" has a
// letter after it, so it draws the isolated form and the word appears on
// screen as two broken pieces with a gap.
//
// No amount of CSS on the <mark> fixes that; the break is in text shaping, not
// in layout. The fix is to not put the boundary there. Marking the whole word
// highlights slightly more than was typed, which is the right trade: the
// reader is being shown WHERE the term is, and a Persian reader looking for
// "نهایی" is looking for the word, not for five of its letters.
//
// Latin text is unaffected -- it joins nothing, so the guard below never fires
// and an English match is still marked exactly as typed.
function wordSpan(text, from, to) {
  if (!joiner.test(text.slice(from, to))) return [from, to];
  while (from > 0 && joiner.test(text[from - 1])) from--;
  while (to < text.length && joiner.test(text[to])) to++;
  return [from, to];
}

// ---------- wiring ----------

$('q').oninput = () => {
  clearTimeout(timer);
  timer = setTimeout(search, 110);
  // Typing is a decision to search rather than browse, so the folder panel
  // gets out of the way.
  //
  // Without this, searching on a phone looked broken: the query ran, the
  // results changed underneath -- measured, 200 documents down to 139 -- and
  // the reader saw none of it, because the folder panel opens by default now
  // and is full width. elementFromPoint over the results pane returned a
  // folder row. The search was working; only the answer was hidden.
  //
  // Once, and only while the panel is the one that opened itself. Somebody
  // who deliberately reopens folders with a query still in the box is
  // browsing on purpose and should not have it shut on the next keystroke.
  const typed = $('q').value.trim();
  if (phoneView.matches && typed && !searchTookOver) {
    searchTookOver = true;
    document.body.classList.remove('nav-open');
  }
  // Emptied: the next search starts from the same footing as the first.
  if (!typed) searchTookOver = false;
};
// Whether searching has already claimed the screen from the folder panel.
// Reset when the field is emptied, so clearing a search and starting again
// behaves the same way the first search did.
let searchTookOver = false;
$('q').addEventListener('focus', () => { $('qHint').style.display = 'none'; });
$('q').addEventListener('blur', () => { $('qHint').style.display = $('q').value.trim() ? 'none' : ''; });
$('clearQ').onclick = () => {
  $('q').value = '';
  searchTookOver = false;
  $('q').focus();
  search();
};

// The question toggle.
//
// Remembered in localStorage, because somebody who works in Persian will want
// it on every time and somebody who searches by reference number will want it
// off every time, and neither should have to say so twice. Wrapped in
// try/catch: a browser with site data blocked throws on access, and the toggle
// still has to work.
$('askToggle').addEventListener('click', () => {
  askMode = !askMode;
  $('askToggle').classList.toggle('btn-primary', askMode);
  $('askToggle').setAttribute('aria-pressed', String(askMode));
  $('q').placeholder = askMode
    ? 'مثلاً: پیش‌فاکتورهای تیر ۱۴۰۴'
    : 'Reference number, or any words inside the documents…';
  try { localStorage.setItem('docfind.ask', askMode ? '1' : '0'); } catch {}
  search();
});
try {
  if (localStorage.getItem('docfind.ask') === '1') $('askToggle').click();
} catch {}

$('refreshBtn').onclick = async e => {
  const btn = e.currentTarget;
  btn.disabled = true;
  // A rescan re-reads whatever changed, and for a scanned PDF that means OCR
  // with a 90-second budget per page. This is the longest wait in the app, so
  // it always deserves the loader -- busy() reveals it after 300ms.
  try {
    await busy((async () => {
      await jpost(api('/api/rescan'));
      await tree();
      await search();
    })());
    toast('Up to date.');
  } catch (err) { toast(problem(err), true); }
  btn.disabled = false;
};

document.addEventListener('keydown', e => {
  if ($('app').classList.contains('hidden')) return;
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); return; }
  if (e.key === 'Escape') { $('q').value = ''; $('q').focus(); search(); return; }
  if (!rows.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); show(Math.min((sel ?? -1) + 1, rows.length - 1)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); show(Math.max((sel ?? 1) - 1, 0)); }
});

(async () => {
  try {
    const s = await jget(api('/api/status'));
    if (s.needs_setup) { showSetup(s.setup_reason); return; }
    hideBoot();
    $('app').classList.remove('hidden');
    $('app').classList.add('flex');
    // Before the first tree, because wireDocsRows reads these to decide
    // whether a row gets a menu at all. After it, and the first draw would
    // be inert until something redrew it.
    await loadDocsPerm();
    await tree();
    // ?q= opens the archive already searching -- how a link to a proforma or
    // order number lands here, the search palette's among them.
    const q0 = new URLSearchParams(location.search).get('q');
    if (q0) $('q').value = q0;
    await search();
    $('q').focus();
  } catch (e) {
    showSetup(problem(e));
  }
})();

// ---------------------------------------------------------------------------
// Accounts and installable-app bootstrap.
//
// Both are additive: on the desktop build the server reports accounts are off,
// nothing is shown, and this file behaves exactly as it did before.
(async function accountsAndPWA() {
  let isAdmin = false, who = null, account = null;
  const signOut = () => fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
    .finally(() => location.replace('/login'));

  try {
    const me = await (await fetch('/api/me', { credentials: 'same-origin' })).json();
    // The account carries the display preferences; the copy applied before
    // paint came from this browser's cache, so reconcile them here.
    if (window.docfindPrefs) window.docfindPrefs.write((me.user && me.user.prefs) || null);
    if (me.auth_enabled) {
      if (!me.user) {
        // Not signed in: the API calls above will have failed with 401 and
        // the page is useless, so send them to sign in.
        location.replace('/login?next=' + encodeURIComponent(location.pathname));
        return;
      }
      const u = me.user;
      who = u.display_name || u.username;
      isAdmin = u.role === 'admin';
      // Kept out here because buildNav runs after this block closes; the
      // account object itself is const and scoped to the try.
      account = u;
      window.docfindOffice = !!u.has_office;
      document.querySelectorAll('.word-btn').forEach(b => { b.hidden = !window.docfindOffice; });
      $('navUser').textContent = who;
      $('navUser').classList.remove('hidden');
      $('navSignOut').classList.remove('hidden');
      // Managing users is an administrator's job; hiding the link for
      // everyone else keeps the toolbar honest about what they can do. The
      // page and the API both check again on their own.
      if (isAdmin) $('navSettings').classList.remove('hidden');
      $('navSignOut').addEventListener('click', signOut);
    }
  } catch (e) {
    // Never let this stop the document browser from working.
  }

  // The phone menu is built once the answers are in, so it lists only the
  // places this person can actually reach.
  if (typeof buildNav === 'function') {
    // navlinks:false -- this toolbar is in English on purpose and already
    // carries its own destinations. The phone sheet is still built.
    buildNav({ admin: isAdmin, user: who, account: account,
               navlinks: false, onSignOut: who ? signOut : null });
  }

  // The worker is registered by nav.js, which this page already loads. It was
  // done here too, and on two other pages, and not at all on the three that
  // needed it just as much -- so it moved to the one file they all share.
})();

// ---------------------------------------------------------------------------
// Phone navigation.
//
// On a narrow screen the three panes are one screen at a time (see the media
// query in the head), so these move between them. On a wide screen the
// buttons are hidden and the body classes have no styling attached, which is
// why none of this needs a width check.
(function phoneNav() {
  const body = document.body;
  const closeNav = () => body.classList.remove('nav-open');

  // The Folders button is gone -- the folder list is the first screen now, so
  // the control pointed at where the reader already was. Getting back to it
  // from the results is the menu's job, which is why the sheet carries the
  // archive as a destination.
  $('navBack').addEventListener('click', () => body.classList.remove('show-view'));
  $('scrim').addEventListener('click', closeNav);

  // Opening a document moves to the document screen; picking a folder moves
  // back to the results, since that is what was just filtered.
  $('list').addEventListener('click', e => {
    if (e.target.closest('[data-i]')) body.classList.add('show-view');
  });
  $('side').addEventListener('click', e => {
    const row = e.target.closest('[data-all],[data-g]');
    if (!row) return;
    // Either way the results behind have just been refiltered, so the
    // document screen is no longer showing anything that belongs to them.
    body.classList.remove('show-view');
    // A folder that drills into another level keeps the panel open -- the
    // whole point of the tap was to see what is inside. Closing on every
    // tap is what made the levels below the first unreachable: the drawer
    // dismissed itself the moment it had something new to show.
    if (row.dataset.into) return;
    closeNav();
  });
})();
</script>
</body>
</html>
